<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pikachu – Pokémon Gen I</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="logo">
        <svg class="pokeball-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 50 A40 40 0 0 1 90 50" fill="#EE1515"/>
          <path d="M10 50 A40 40 0 0 0 90 50" fill="#ffffff"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="#1A237E" stroke-width="6"/>
          <line x1="10" y1="50" x2="90" y2="50" stroke="#1A237E" stroke-width="6"/>
          <circle cx="50" cy="50" r="13" fill="white" stroke="#1A237E" stroke-width="6"/>
        </svg>
        <span class="logo-text">POKÉMON</span>
      </div>

      <button class="hamburger" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <main class="hero">
      <div class="hero-left">
        <p class="eyebrow">POKEMON GEN I</p>
        <p class="title">Pikachu</p>
        <p class="description">
          Pikachu is an Electric-type Pokémon introduced<br>
          in Generation I. Pikachu are small, chubby,<br>
          and incredibly cute mouse-like Pokémon.<br>
          They are almost completely covered by<br>
          yellow fur.
        </p>
        <div class="pagination">
          <span class="dash">—</span>
          <span class="count">01 / 08</span>
        </div>
        <div class="pokeball-watermark" aria-hidden="true"></div>
      </div>
      <img id="pikachu-img" src="Pika.png" alt="Pikachu" class="pikachu-img" />

      <div class="hero-right">
        
        <nav class="dots-nav" aria-label="Pokémon navigation">
          <button class="dot active" aria-label="Pikachu – slide 1"></button>
          <button class="dot" aria-label="Slide 2"></button>
          <button class="dot" aria-label="Slide 3"></button>
          <button class="dot" aria-label="Slide 4"></button>
        </nav>
      </div>
    </main>

  </div>
  <script src="script.js"></script>
</body>
</html>
