<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pikachu Landing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-logo">Pokemon</span>
      </div>
      <button class="menu-btn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">POKEMON GEN I</p>
        <h1>Pikachu</h1>
        <p class="hero-text">
          Pikachu is an Electric-type Pokémon introduced in Generation I. Pikachu are small,
          chubby, and incredibly cute mouse-like Pokémon. They are almost completely covered
          by yellow fur.
        </p>
        <div class="hero-footer">
          <span class="divider"></span>
          <span class="page-count">01 / 08</span>
        </div>
      </div>

      <div class="hero-visual" aria-hidden="true">
        <div class="pikachu">
          <div class="ear ear-left"></div>
          <div class="ear ear-right"></div>
          <div class="head">
            <div class="cheek cheek-left"></div>
            <div class="cheek cheek-right"></div>
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
          <div class="body"></div>
          <div class="tail"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
